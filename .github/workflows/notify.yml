name: notify
# Sends one ntfy push. Used by the hourly Claude listing checker, which opens and
# verifies Zillow/Trulia listings before pushing. De-duped by `key` (pushed.json).

on:
  workflow_dispatch:
    inputs:
      title:    { description: "Push title", required: true }
      message:  { description: "Push body", required: true }
      url:      { description: "Link to open", required: false, default: "" }
      key:      { description: "Dedupe key (e.g. listing URL)", required: true }
      priority: { description: "1-5", required: false, default: "4" }

permissions:
  contents: write

concurrency:
  group: rent-a-hawk-state
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send push (once per key)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TITLE: ${{ inputs.title }}
          MESSAGE: ${{ inputs.message }}
          URL: ${{ inputs.url }}
          KEY: ${{ inputs.key }}
          PRIORITY: ${{ inputs.priority }}
        run: python3 notify.py
      - name: Save pushed keys
        run: |
          git config user.name "rent-a-hawk-bot"
          git config user.email "rent-a-hawk-bot@users.noreply.github.com"
          git add pushed.json
          git diff --cached --quiet && exit 0
          git commit -m "Record pushed listing [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
          exit 1

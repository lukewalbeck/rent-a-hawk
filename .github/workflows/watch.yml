name: craigslist-watch

on:
  schedule:
    # Every 20 min (odd minutes avoid GitHub congestion), ~6am–11pm Pacific (times are UTC). GitHub may delay runs a few minutes.
    - cron: "8,28,48 0-7,14-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: normal
        options: [normal, test-notify, notify-existing]

permissions:
  contents: write

concurrency:
  group: craigslist-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Craigslist
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          case "${{ inputs.mode }}" in
            test-notify)     python cl_watch.py --test-notify ;;
            notify-existing) python cl_watch.py --notify-existing ;;
            *)               python cl_watch.py ;;
          esac

      - name: Save seen listings
        run: |
          git config user.name "rent-a-hawk-bot"
          git config user.email "rent-a-hawk-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen listings [skip ci]"
          git push

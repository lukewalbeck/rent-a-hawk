name: appfolio-test
# Temporary: dry-run of appfolio_watch.py on this branch. Remove before merging.
on:
  push:
    branches: [appfolio-watch]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Parsed cards
        run: |
          python - <<'PY'
          import appfolio_watch as aw
          for site in aw.SITES:
              html, url = aw.fetch_index(site)
              print("=====", site, len(html), "bytes")
              for uid, node in aw.cards(html):
                  d = aw.parse_card(uid, node, html)
                  print({k: d[k] for k in ["header","price","beds","sqft","zip","hood","address","lat"]})
                  print("   text:", d["body"][:600])
          PY
      - name: Dry run
        run: python appfolio_watch.py --dry-run --notify-existing
